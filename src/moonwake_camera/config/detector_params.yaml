# moonwake_camera 检测参数
#
# 加载方式：
#   ros2 run moonwake_camera buoy_detector_node --ros-args \
#     --params-file ~/moonwake_autonomy/src/moonwake_camera/config/detector_params.yaml
#
# 注意：
#   * 顶层 key 必须和节点名一致（Node("buoy_detector_node")），否则参数不会生效
#   * OpenCV 的 H 范围是 0~180（不是 0~360），这里填的都是 OpenCV 口径
#   * 这里只写了「启动时读取」的参数；节点支持动态改的（h_min 等）可以用 ros2 param set 实时调

buoy_detector_node:
  ros__parameters:
    # ── 检测后端 ────────────────────────────────────────────
    # hsv  = 原来的 OpenCV 颜色阈值 + 自适应阈值 + 连通域方案
    # yolo = ONNX Runtime 推理（需要模型文件，且编译时找到 ONNX Runtime）
    detector_backend: hsv

    # yolo 后端专用参数（detector_backend: hsv 时全部忽略）
    model_path: "/home/shaofei/perception_release_v1/model.onnx"
    # 置信度阈值（模型契约默认 0.25）
    model_conf_threshold: 0.25
    # NMS 的 IoU 阈值（模型契约默认 0.7）
    model_iou_threshold: 0.7
    # 模型输入边长，必须和模型实际输入一致（当前 640）
    model_input_size: 640
    # 推理线程数：0 = 交给 ONNX Runtime 决定
    # 这台机器实测：默认 141 ms/帧，限制到 4 线程 102 ms/帧（核多时反而更慢）
    model_num_threads: 0
    # 类别名，多个用逗号分隔；单类模型就是 green_buoy
    model_class_names: "green_buoy"

    adaptive_block_size: 11
    adaptive_C: 1.5
    # ── HSV 阈值 ────────────────────────────────────────────
    # H: 0~180（对应 0~360 度）；S/V: 0~255
    h_min: 45
    h_max: 75
    s_min: 95
    s_max: 255
    v_min: 85
    v_max: 255

    # ── 连通域过滤 ──────────────────────────────────────────
    # 面积小于 min_area 的连通域会被丢弃，单位是像素
    min_area: 100
    # 形态学核大小，getStructuringElement(MORPH_ELLIPSE, Size(k,k))
    kernel_size: 8

    # ── 时序 ────────────────────────────────────────────────
    # 数据年龄超过这个值判为 STATUS_INPUT_STALE（秒）
    # 用视频回放测试时，发布端时间戳是"当前时刻"，这个值保持 0.5 即可
    stale_threshold_sec: 0.5

    # ── 调试 ────────────────────────────────────────────────
    # 把处理后的 mask 发布到 debug_mask 话题，调参阶段建议开
    publish_debug_mask: true
    # 把检测框画在原图上，发布到 debug 话题（rqt_image_view /debug 直接看）
    # 默认开启；每帧多约 5~6 ms（2400x1080），追求极限帧率时再关
    publish_debug_image: true

    # ── 异常样本保存 ────────────────────────────────────────
    # 总开关：false 时完全不保存（连目录都不会创建）
    save_failure_samples: false
    # 留空 = 自动存到 <本包目录>/failure_samples/
    # 想换个地方就写绝对路径，例如 /home/shaofei/data/samples
    failure_dir: ""
    # 两次落盘的最小间隔（秒），防止连续失败把磁盘写满
    # 0 表示不限速（每次失败都存）；想更省就调大，比如 30
    failure_min_interval_sec: 10.0
    # 单次运行最多保存多少份，<=0 表示不限制
    failure_max_samples: 200


# ──────────────────────────────────────────────────────────────
# 用视频代替相机时，video_publisher 节点的参数
# 这个文件会同时传给检测节点和视频发布节点，各读各的段落
# ──────────────────────────────────────────────────────────────
video_publisher:
  ros__parameters:
    # 发布图像的编码，默认 bgr8（OpenCV 解码出来的原生格式）
    # 可选：bgr8 / rgb8 / mono8 / bgra8
    # 改成 mono8 可以模拟灰度相机；检测节点内部会统一转成 bgr8 处理
    encoding: bgr8

